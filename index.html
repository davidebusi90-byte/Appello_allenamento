<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appello allenamento Sabato</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #fdfcf0; 
            --primary: #d1d9ff;  
            --accent: #c1e1c1;   
            --import: #f9f1c2;    
            --danger: #000000; /* X Nera */
            --text: #5a5a5a;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color); color: var(--text);
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
        }
        h1 { color: #8a96d7; font-weight: 300; margin-bottom: 25px; }

        .controls {
            background: white; padding: 20px; border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            margin-bottom: 20px; display: flex; gap: 10px;
            flex-wrap: wrap; justify-content: center; width: 100%; max-width: 800px;
        }
        input, button { padding: 12px; border: 1px solid #eee; border-radius: 12px; outline: none; }
        button { cursor: pointer; border: none; font-weight: bold; color: var(--text); transition: 0.2s; }
        .btn-add { background-color: var(--primary); }
        .btn-import { background-color: var(--import); }
        .btn-export { background-color: var(--accent); }
        .btn-clear { background-color: #ffb3ba; } /* Reset rimane rosino chiaro per sicurezza */
        
        #searchBar { width: 100%; max-width: 400px; margin-bottom: 20px; border: 2px solid var(--primary); }

        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px; width: 100%; max-width: 900px;
        }
        .card {
            background: white; border-radius: 15px; padding: 15px;
            text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.03);
            border: 3px solid transparent; position: relative; transition: 0.3s;
        }
        .card.present { border-color: var(--accent); background-color: #f0fff0; }
        
        /* X Nera per eliminare */
        .delete-btn {
            position: absolute; top: 8px; right: 8px;
            background: var(--danger); color: white;
            border-radius: 50%; width: 20px; height: 20px;
            font-size: 11px; cursor: pointer; border: none; z-index: 10;
            display: flex; align-items: center; justify-content: center;
        }
        
        .profile-img-container {
            width: 85px; height: 85px; margin: 0 auto 10px;
        }
        .profile-img { 
            width: 100%; height: 100%; border-radius: 50%; 
            object-fit: cover; cursor: pointer; background: #f0f0f0;
            border: 2px solid #eee; transition: 0.2s;
        }
        .profile-img:hover { border-color: var(--primary); transform: scale(1.05); }
        
        .hidden-input { display: none; }
    </style>
</head>
<body>
    <h1>Appello allenamento Sabato</h1>
    
    <div class="controls">
        <input type="text" id="lastName" placeholder="Cognome">
        <input type="text" id="firstName" placeholder="Nome">
        <button class="btn-add" onclick="addUser()">+ Aggiungi Singolo</button>
        
        <input type="file" id="excelInput" accept=".xlsx, .xls, .csv" class="hidden-input" onchange="importAtleti(event)">
        <button class="btn-import" onclick="document.getElementById('excelInput').click()">📂 Carica Iscritti 2026</button>
        
        <button class="btn-export" onclick="exportToExcel()">📊 Esporta Presenze</button>
        <button class="btn-clear" onclick="clearData()">🗑️ Reset Totale</button>
    </div>

    <input type="file" id="cameraInput" accept="image/*" capture="user" class="hidden-input">

    <input type="text" id="searchBar" placeholder="🔍 Cerca atleta..." onkeyup="filterAtleti()">

    <div class="grid" id="userGrid"></div>

    <script>
        let participants = JSON.parse(localStorage.getItem('atleti_data')) || [];
        let editingUserId = null;

        window.onload = renderGrid;

        function save() { localStorage.setItem('atleti_data', JSON.stringify(participants)); }

        function importAtleti(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(sheet);
                
                json.forEach((row, i) => {
                    const cognome = row['COGNOME'] || row['Cognome'] || "";
                    const nome = row['NOME'] || row['Nome'] || "";
                    if (nome || cognome) {
                        participants.push({
                            id: Date.now() + i + Math.random(),
                            name: String(nome).trim(),
                            surname: String(cognome).trim(),
                            photo: `https://ui-avatars.com/api/?name=${nome}+${cognome}&background=d1d9ff&color=5a5a5a`,
                            present: false
                        });
                    }
                });
                save(); renderGrid();
                event.target.value = "";
            };
            reader.readAsArrayBuffer(file);
        }

        function filterAtleti() {
            const query = document.getElementById('searchBar').value.toLowerCase();
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(query) ? "block" : "none";
            });
        }

        function addUser() {
            const name = document.getElementById('firstName').value;
            const surname = document.getElementById('lastName').value;
            if (!name || !surname) return alert("Inserisci nome e cognome");
            
            participants.push({
                id: Date.now(), name, surname,
                photo: `https://ui-avatars.com/api/?name=${name}+${surname}&background=d1d9ff&color=5a5a5a`,
                present: false
            });
            save(); renderGrid();
            document.getElementById('firstName').value = ''; 
            document.getElementById('lastName').value = '';
        }

        // Funzione per caricare la foto cliccando sul tondo
        function openCamera(id, event) {
            event.stopPropagation();
            editingUserId = id;
            document.getElementById('cameraInput').click();
        }

        document.getElementById('cameraInput').onchange = function(e) {
            const file = e.target.files[0];
            if (!file || !editingUserId) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const user = participants.find(p => p.id === editingUserId);
                if (user) {
                    user.photo = event.target.result;
                    save();
                    renderGrid();
                }
            };
            reader.readAsDataURL(file);
        };

        function togglePresence(id) {
            const u = participants.find(p => p.id === id);
            u.present = !u.present;
            save(); renderGrid();
        }

        function removeUser(id, e) {
            e.stopPropagation();
            if(confirm("Eliminare definitivamente questo atleta?")) {
                participants = participants.filter(p => p.id !== id);
                save(); renderGrid();
            }
        }

        function renderGrid() {
            const grid = document.getElementById('userGrid');
            grid.innerHTML = '';
            // Ordine alfabetico per cognome
            participants.sort((a, b) => a.surname.localeCompare(b.surname)).forEach(u => {
                const card = document.createElement('div');
                card.className = `card ${u.present ? 'present' : ''}`;
                card.onclick = () => togglePresence(u.id);
                card.innerHTML = `
                    <button class="delete-btn" onclick="removeUser(${u.id}, event)">✕</button>
                    <div class="profile-img-container">
                        <img src="${u.photo}" class="profile-img" onclick="openCamera(${u.id}, event)">
                    </div>
                    <div style="font-weight:bold; font-size: 0.9em;">${u.surname.toUpperCase()}</div>
                    <div style="font-size: 0.9em;">${u.name}</div>
                    <div style="font-size:0.7em; margin-top:5px; color: ${u.present ? '#2d5a2d' : '#999'}">
                        ${u.present ? '● PRESENTE' : '○ ASSENTE'}
                    </div>`;
                grid.appendChild(card);
            });
        }

        function clearData() { if(confirm("Cancellare tutta la lista? Azione irreversibile.")) { participants = []; save(); renderGrid(); } }

        function exportToExcel() {
            const data = participants.map(p => ({ Cognome: p.surname, Nome: p.name, Stato: p.present ? 'Presente' : 'Assente' }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Presenze");
            XLSX.writeFile(wb, `Appello_Sabato_${new Date().toLocaleDateString()}.xlsx`);
        }
    </script>
</body>
</html>
