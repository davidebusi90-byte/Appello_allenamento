<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appello RD Academy</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #fdfcf0; 
            --primary: #d1d9ff;  --secondary: #ffd8be; 
            --accent: #c1e1c1;   --import: #f9f1c2;    
            --danger: #ffb3ba;   --text: #5a5a5a;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color); color: var(--text);
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
        }
        .controls {
            background: white; padding: 20px; border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            margin-bottom: 20px; display: flex; gap: 10px;
            flex-wrap: wrap; justify-content: center; width: 100%; max-width: 800px;
        }
        input, button { padding: 12px; border: 1px solid #eee; border-radius: 12px; outline: none; }
        button { cursor: pointer; border: none; font-weight: bold; color: var(--text); transition: 0.2s; }
        .btn-add { background-color: var(--primary); }
        .btn-import { background-color: var(--import); }
        .btn-export { background-color: var(--accent); }
        .btn-clear { background-color: var(--danger); }
        
        #searchBar { width: 100%; max-width: 400px; margin-bottom: 20px; border: 2px solid var(--primary); }

        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px; width: 100%; max-width: 900px;
        }
        .card {
            background: white; border-radius: 15px; padding: 15px;
            text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.03);
            border: 3px solid transparent; position: relative; transition: 0.3s;
        }
        .card.present { border-color: var(--accent); background-color: #f0fff0; }
        .delete-btn {
            position: absolute; top: 5px; right: 5px;
            background: var(--danger); color: white;
            border-radius: 50%; width: 22px; height: 22px;
            font-size: 12px; cursor: pointer; border: none;
        }
        .profile-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; background: #eee; }
        .hidden-input { display: none; }
    </style>
</head>
<body>
    <h1 style="color: #8a96d7; font-weight: 300;">Appello RD Academy</h1>
    
    <div class="controls">
        <input type="text" id="firstName" placeholder="Nome">
        <input type="text" id="lastName" placeholder="Cognome">
        <input type="file" id="photoInput" accept="image/*" class="hidden-input">
        <button onclick="document.getElementById('photoInput').click()">📸 Foto</button>
        <button class="btn-add" onclick="addUser()">+ Aggiungi</button>
        
        <input type="file" id="excelInput" accept=".xlsx, .xls, .csv" class="hidden-input" onchange="importAtleti(event)">
        <button class="btn-import" onclick="document.getElementById('excelInput').click()">📂 Carica Iscritti 2026</button>
        
        <button class="btn-export" onclick="exportToExcel()">📊 Esporta</button>
        <button class="btn-clear" onclick="clearData()">🗑️ Reset</button>
    </div>

    <input type="text" id="searchBar" placeholder="🔍 Cerca atleta per nome o cognome..." onkeyup="filterAtleti()">

    <div class="grid" id="userGrid"></div>

    <script>
        let participants = JSON.parse(localStorage.getItem('atleti_data')) || [];
        window.onload = renderGrid;

        function save() { localStorage.setItem('atleti_data', JSON.stringify(participants)); }

        function importAtleti(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(sheet);
                
                json.forEach((row, i) => {
                    // Mappatura specifica per il tuo file: COGNOME e NOME
                    const cognome = row['COGNOME'] || row['Cognome'] || "";
                    const nome = row['NOME'] || row['Nome'] || "";
                    
                    if (nome || cognome) {
                        participants.push({
                            id: Date.now() + i + Math.random(),
                            name: String(nome).trim(),
                            surname: String(cognome).trim(),
                            photo: `https://ui-avatars.com/api/?name=${nome}+${cognome}&background=ffd8be&color=5a5a5a`,
                            present: false
                        });
                    }
                });
                save(); renderGrid();
                event.target.value = "";
            };
            reader.readAsArrayBuffer(file);
        }

        function filterAtleti() {
            const query = document.getElementById('searchBar').value.toLowerCase();
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(query) ? "block" : "none";
            });
        }

        function addUser() {
            const name = document.getElementById('firstName').value;
            const surname = document.getElementById('lastName').value;
            if (!name) return alert("Inserisci almeno il nome");
            const photoFile = document.getElementById('photoInput').files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                participants.push({
                    id: Date.now(), name, surname,
                    photo: e.target.result || `https://ui-avatars.com/api/?name=${name}+${surname}&background=d1d9ff&color=5a5a5a`,
                    present: false
                });
                save(); renderGrid();
                document.getElementById('firstName').value = ''; document.getElementById('lastName').value = '';
            };
            if (photoFile) reader.readAsDataURL(photoFile);
            else reader.onload({ target: { result: null } });
        }

        function togglePresence(id) {
            const u = participants.find(p => p.id === id);
            u.present = !u.present;
            save(); renderGrid();
        }

        function removeUser(id, e) {
            e.stopPropagation();
            if(confirm("Eliminare atleta?")) {
                participants = participants.filter(p => p.id !== id);
                save(); renderGrid();
            }
        }

        function renderGrid() {
            const grid = document.getElementById('userGrid');
            grid.innerHTML = '';
            participants.sort((a, b) => a.surname.localeCompare(b.surname)).forEach(u => {
                const card = document.createElement('div');
                card.className = `card ${u.present ? 'present' : ''}`;
                card.onclick = () => togglePresence(u.id);
                card.innerHTML = `<button class="delete-btn" onclick="removeUser(${u.id}, event)">✕</button>
                    <img src="${u.photo}" class="profile-img">
                    <div style="font-weight:bold">${u.surname} ${u.name}</div>
                    <div style="font-size:0.8em">${u.present ? '🟢 PRESENTE' : '⚪ ASSENTE'}</div>`;
                grid.appendChild(card);
            });
        }

        function clearData() { if(confirm("Cancellare tutta la lista?")) { participants = []; save(); renderGrid(); } }

        function exportToExcel() {
            const data = participants.map(p => ({ Cognome: p.surname, Nome: p.name, Stato: p.present ? 'Presente' : 'Assente' }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Presenze");
            XLSX.writeFile(wb, `Appello_${new Date().toLocaleDateString()}.xlsx`);
        }
    </script>
</body>
</html>
